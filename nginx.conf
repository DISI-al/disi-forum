# ============================================================
# DISI 技术论坛 — Nginx 配置文件
# 适用于 Linux 服务器部署
#
# 放置位置：/etc/nginx/sites-available/disi-forum
# 启用方式：ln -s /etc/nginx/sites-available/disi-forum /etc/nginx/sites-enabled/
# 测试配置：nginx -t
# 重载配置：nginx -s reload
# ============================================================

server {
    listen 80;
    server_name _;   # 替换为你的域名，如 disi.example.com

    # 字符集
    charset utf-8;

    # 访问日志
    access_log /var/log/nginx/disi-forum-access.log;
    error_log  /var/log/nginx/disi-forum-error.log;

    # ============================================================
    # 前端静态文件（Vue 打包后的 dist 目录）
    # 将 disi_vue_project/dist 下的所有内容复制到 /var/www/disi-forum/
    # ============================================================
    root /var/www/disi-forum;
    index index.html;

    # 前端路由 — SPA 模式，所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口文件禁止缓存，保证每次发版后浏览器都拿到新的 index.html
    # （静态资源带 hash，走下面的 /assets/ 长缓存）
    location = /index.html {
        expires -1;
    }

    # ============================================================
    # 后端 API 反向代理 — 转发到 FastAPI（运行在 127.0.0.1:8000）
    # ============================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传文件大小限制（最大 500MB）
        client_max_body_size 500M;
    }

    # ============================================================
    # 上传文件访问 — 同样代理到后端
    # ============================================================
    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # ============================================================
    # 静态资源缓存（JS/CSS/图片/字体等带 hash 的文件）
    # ============================================================
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # favicon
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ============================================================
    # 安全头
    # ============================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

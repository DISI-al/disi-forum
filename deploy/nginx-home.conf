# DISI 主站（门户：介绍 / 下载 / 源码）
# 放到 /etc/nginx/conf.d/disi-home.conf
server {
    listen 80;
    server_name disi-al.com www.disi-al.com;

    root /var/www/home;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API（与论坛/INSIST 共用同一后端）
    client_max_body_size 500M;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # 客户端安装包
    location /download/ {
        alias /var/www/download/;
        autoindex off;
        add_header Content-Disposition "attachment" always;
    }

    # 门户页需要的图标
    location = /favicon.ico { try_files $uri =404; }
    location = /icon.png    { try_files $uri =404; }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(png|jpg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
